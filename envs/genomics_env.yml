name: genomics_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - samtools=1.15
  - bcftools=1.15
  - bedtools=2.30.0
  - bwa=0.7.17
  - bowtie2=2.4.5
  - star=2.7.3a
  - wtdbg=2.5
  - pilon=1.24
  - orthofinder=2.5.4
  - iqtree=2.2.0
  - trimal=1.4.1
  - blast=2.12.0
  - hicexplorer=3.7.2
  - syri=1.6
  - ragtag=2.1.0
  - seqtk=1.3
  - r-base=4.1.3
  - r-edger=3.36.0
  - r-ggplot2=3.3.5
  - pip
  - pip:
    - numpy
    - pandas
    - scipy
